services:
  agent:
    image: ${AGENT_IMAGE:-ghcr.io/your-org/pi-agent:latest}
    pull_policy: always
    container_name: pi-node-agent
    network_mode: host
    pid: host
    environment:
      AGENT_TOKEN: changeme
      AGENT_NAME: ""
      AGENT_SERVICES: ssh,cron
      AGENT_DASHBOARD_URL: http://dashboard-host:8000
      AGENT_ENROLL_SECRET: changeme-enroll
      AGENT_ENROLL_ENABLED: "true"
      AGENT_ENROLL_RETRY_SECONDS: 10
      AGENT_TOKEN_REFRESH_ENABLED: "true"
      AGENT_TOKEN_REFRESH_SECONDS: 3600
      AGENT_PUSH_ENABLED: "false"
      AGENT_PUSH_INTERVAL_SECONDS: 10
      AGENT_TOKEN_FILE: /data/agent_token.txt
      AGENT_LOCAL_SECRET_KEY: ${AGENT_LOCAL_SECRET_KEY:-}
      AGENT_ID: ""
      AGENT_ID_FILE: /data/agent_id.txt
    volumes:
      - ./agent-data:/data
    restart: unless-stopped
