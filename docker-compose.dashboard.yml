services:
  dashboard:
    image: ${DASHBOARD_IMAGE:-ghcr.io/your-org/pi-dashboard:latest}
    pull_policy: always
    container_name: pi-cluster-dashboard
    ports:
      - "8000:8000"
    environment:
      DASHBOARD_DB_PATH: /data/cluster.db
      DASHBOARD_POLL_BASE_SECONDS: 2
      DASHBOARD_HTTP_TIMEOUT_SECONDS: 4
      DASHBOARD_AGENT_DEFAULT_PORT: 8001
      DASHBOARD_METRIC_RETENTION_HOURS: 48
      DASHBOARD_ALERT_RETENTION_DAYS: 14
      DASHBOARD_SERVICE_RETENTION_DAYS: 7
      DASHBOARD_CLEANUP_INTERVAL_SECONDS: 300
      DASHBOARD_WEBHOOK_URL: ${DASHBOARD_WEBHOOK_URL:-}
      DASHBOARD_WEBHOOK_TIMEOUT_SECONDS: ${DASHBOARD_WEBHOOK_TIMEOUT_SECONDS:-3}
      DASHBOARD_WEBHOOK_RETRY_BASE_SECONDS: ${DASHBOARD_WEBHOOK_RETRY_BASE_SECONDS:-15}
      DASHBOARD_WEBHOOK_MAX_ATTEMPTS: ${DASHBOARD_WEBHOOK_MAX_ATTEMPTS:-5}
      DASHBOARD_WEBHOOK_DISPATCH_INTERVAL_SECONDS: ${DASHBOARD_WEBHOOK_DISPATCH_INTERVAL_SECONDS:-5}
      DASHBOARD_NODE_TOKEN_KEY: ${DASHBOARD_NODE_TOKEN_KEY:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
